<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Threads</title>
<style>
  :root {
    --bg: #f5f5f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73; --line: #d9d9de;
    --accent: #0a84ff; --accent-text: #ffffff; --danger: #d70015; --row-active: #e3eefe;
    --tag-personal: #e8e8ed; --tag-creator: #fde7c8; --tag-creator-text: #8a4b00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --panel: #2c2c2e; --text: #f5f5f7; --muted: #a1a1a6; --line: #3a3a3c;
      --accent: #0a84ff; --danger: #ff6961; --row-active: #1f3a5f;
      --tag-personal: #3a3a3c; --tag-creator: #5a3d12; --tag-creator-text: #ffd699;
    }
  }
  :root { --w: 240px; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  aside {
    position: fixed; inset: 0 auto 0 0; width: var(--w); display: flex; flex-direction: column;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .topbar {
    position: fixed; top: 0; left: var(--w); right: 0; height: 38px; 
    display: flex; align-items: center; justify-content: center; padding: 0 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .drag { height: 44px; flex: none;  }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px 16px; }
  h1 { margin: 0; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
  #toggle { border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 4px; padding: 2px 8px; font: inherit; font-size: 15px; line-height: 1; }
  #toggle:hover, #toggle:focus-visible { color: var(--text); background: var(--bg); }
  .avatar { flex: none; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; background: var(--tag-personal); color: var(--text); }
  .avatar.creator { background: var(--tag-creator); color: var(--tag-creator-text); }
  body.collapsed .head { justify-content: center; padding: 0 0 8px; }
  body.collapsed h1, body.collapsed .name, body.collapsed .tag, body.collapsed .acts, body.collapsed form, body.collapsed #toast, body.collapsed .label { display: none !important; }
  body.collapsed .row { justify-content: center; padding: 8px 0; }
  #list { flex: 1; overflow-y: auto; padding: 0 8px; margin: 0; list-style: none; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; cursor: pointer;
  }
  .row:hover { background: var(--bg); }
  .row[aria-current="true"] { background: var(--row-active); }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 999px; background: var(--tag-personal); color: var(--muted); }
  .tag.creator { background: var(--tag-creator); color: var(--tag-creator-text); }
  .acts { display: none; gap: 2px; }
  .row:hover .acts, .row:focus-within .acts { display: flex; }
  .acts button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 4px; border-radius: 4px; font: inherit; font-size: 12px; }
  .acts button:hover, .acts button:focus-visible { color: var(--text); background: var(--line); }
  .acts .del:hover, .acts .del:focus-visible { color: var(--danger); }
  footer { flex: none; padding: 8px; border-top: 1px solid var(--line); }
  button.primary {
    width: 100%; padding: 7px 10px; border: 0; border-radius: 8px; background: var(--accent);
    color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer;
  }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  form { display: none; flex-direction: column; gap: 8px; padding: 8px; border-top: 1px solid var(--line); }
  form.open { display: flex; }
  form label { display: flex; flex-direction: column; gap: 3px; color: var(--muted); font-size: 11px; }
  input, select {
    font: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); -webkit-user-select: text; user-select: text;
  }
  .btns { display: flex; gap: 6px; }
  .btns button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; cursor: pointer; }
  .btns button[type="submit"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  #toast { margin: 0 8px 8px; padding: 6px 8px; border-radius: 6px; background: var(--tag-creator); color: var(--tag-creator-text); font-size: 12px; display: none; }
  #toast.show { display: block; }
  #error { color: var(--danger); font-size: 12px; min-height: 0; margin: 0; }
  main {
    position: fixed; inset: 38px 0 0 var(--w); display: none; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); padding: 24px;
  }
  main.show { display: flex; }
  main p { margin: 4px 0; }
  main strong { color: var(--text); font-size: 16px; }
</style>
</head>
<body>
<div class="topbar" id="topbar"></div>
<aside>
  <div class="drag"></div>
  <div class="head"><h1>账号</h1><button id="toggle" type="button" aria-label="折叠侧边栏" title="折叠侧边栏">‹</button></div>
  <ul id="list"></ul>
  <form id="form" autocomplete="off">
    <label>名称<input id="name" maxlength="40" required></label>
    <label>类型
      <select id="type">
        <option value="personal">个人</option>
        <option value="creator">创作者</option>
      </select>
    </label>
    <p id="error" role="alert"></p>
    <div class="btns">
      <button type="button" id="cancel">取消</button>
      <button type="submit" id="submit">添加</button>
    </div>
  </form>
  <p id="toast" role="alert"></p>
  <footer><button class="primary" id="add" title="添加账号"><span>+</span><span class="label"> 添加账号</span></button></footer>
</aside>
<main id="empty">
  <div>
    <p><strong>还没有账号</strong></p>
    <p>点左下角「添加账号」,然后在右侧用 Threads 账号登录。</p>
  </div>
</main>
<script>
  const TYPE_LABEL = { personal: '个人', creator: '创作者' }
  const $ = (id) => document.getElementById(id)
  let state = { accounts: [], activeId: null }
  let editingId = null // null = adding

  function render() {
    const list = $('list')
    list.replaceChildren()
    for (const a of state.accounts) {
      const li = document.createElement('li')
      li.className = 'row'
      li.tabIndex = 0
      li.setAttribute('role', 'button')
      if (a.id === state.activeId) li.setAttribute('aria-current', 'true')

      const avatar = document.createElement('span')
      avatar.className = 'avatar' + (a.type === 'creator' ? ' creator' : '')
      avatar.textContent = Array.from(a.name)[0] || '?'
      li.title = `${a.name}(${TYPE_LABEL[a.type]})`

      const name = document.createElement('span')
      name.className = 'name'
      name.textContent = a.name
      name.title = a.name

      const tag = document.createElement('span')
      tag.className = 'tag' + (a.type === 'creator' ? ' creator' : '')
      tag.textContent = TYPE_LABEL[a.type]

      const acts = document.createElement('span')
      acts.className = 'acts'
      const copy = document.createElement('button')
      copy.textContent = '复制'
      copy.setAttribute('aria-label', `复制账号名称 ${a.name}`)
      copy.onclick = async (e) => {
        e.stopPropagation()
        try { toast(`已复制账号名称:${await window.accounts.copyName(a.id)}`) } catch { toast('复制失败,请重试。') }
      }
      const edit = document.createElement('button')
      edit.textContent = '编辑'
      edit.setAttribute('aria-label', `编辑 ${a.name}`)
      edit.onclick = (e) => { e.stopPropagation(); openForm(a) }
      const del = document.createElement('button')
      del.className = 'del'
      del.textContent = '删除'
      del.setAttribute('aria-label', `删除 ${a.name}`)
      del.onclick = (e) => { e.stopPropagation(); run(() => window.accounts.remove(a.id), '删除失败,请重试。') }
      acts.append(copy, edit, del)

      li.append(avatar, name, tag, acts)
      const select = () => { if (a.id !== state.activeId) run(() => window.accounts.select(a.id), '切换失败,请重试。') }
      li.onclick = select
      li.onkeydown = (e) => { if (e.target === li && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select() } }
      list.append(li)
    }
    $('empty').classList.toggle('show', state.accounts.length === 0)
    const active = state.accounts.find((a) => a.id === state.activeId)
    $('topbar').textContent = active ? `${active.name} · ${TYPE_LABEL[active.type]}` : ''
  }

  function apply(next) { state = next; render() }

  let toastTimer
  function toast(message) {
    $('toast').textContent = message
    $('toast').classList.add('show')
    clearTimeout(toastTimer)
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000)
  }
  // Run an account action, show the new state, and tell the user if it failed.
  async function run(action, failure) {
    try { apply(await action()) } catch { toast(failure) }
  }

  function openForm(account) {
    editingId = account ? account.id : null
    $('name').value = account ? account.name : ''
    $('type').value = account ? account.type : 'personal'
    $('submit').textContent = account ? '保存' : '添加'
    $('error').textContent = ''
    $('form').classList.add('open')
    $('name').focus()
  }
  function closeForm() { $('form').classList.remove('open'); editingId = null }

  let collapsed = false
  async function setCollapsed(next) {
    try {
      const width = await window.accounts.setCollapsed(next)
      collapsed = next
      document.documentElement.style.setProperty('--w', `${width}px`)
      document.body.classList.toggle('collapsed', collapsed)
      const label = collapsed ? '展开侧边栏' : '折叠侧边栏'
      $('toggle').textContent = collapsed ? '›' : '‹'
      $('toggle').title = label
      $('toggle').setAttribute('aria-label', label)
      try { localStorage.setItem('sidebarCollapsed', collapsed ? '1' : '0') } catch {}
    } catch { toast('侧边栏切换失败,请重试。') }
  }
  $('toggle').onclick = () => setCollapsed(!collapsed)

  $('add').onclick = async () => { if (collapsed) await setCollapsed(false); openForm(null) }
  $('cancel').onclick = closeForm
  $('form').onkeydown = (e) => { if (e.key === 'Escape') closeForm() }
  $('form').onsubmit = async (e) => {
    e.preventDefault()
    const name = $('name').value
    const type = $('type').value
    try {
      apply(editingId ? await window.accounts.update(editingId, name, type) : await window.accounts.add(name, type))
      closeForm()
    } catch (err) {
      $('error').textContent = '保存失败,请重试。名称需为 1–40 个字符。'
    }
  }

  // Drag the window by the top strips (sidebar header and top bar).
  for (const el of document.querySelectorAll('.topbar, .drag')) {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return
      el.setPointerCapture(e.pointerId)
      const startX = e.screenX
      const startY = e.screenY
      window.windowDrag.start()
      const move = (ev) => window.windowDrag.move(ev.screenX - startX, ev.screenY - startY)
      const end = () => {
        el.removeEventListener('pointermove', move)
        el.removeEventListener('pointerup', end)
        el.removeEventListener('pointercancel', end)
      }
      el.addEventListener('pointermove', move)
      el.addEventListener('pointerup', end)
      el.addEventListener('pointercancel', end)
    })
  }

  run(() => window.accounts.getState(), '读取账号失败,请重启应用。')
  try { if (localStorage.getItem('sidebarCollapsed') === '1') setCollapsed(true) } catch {}
</script>
</body>
</html>
